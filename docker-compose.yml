services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: wafer-fa-timescaledb
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=wafer_fa
      - POSTGRES_USER=wafer_fa
      - POSTGRES_PASSWORD=${WAFER_FA_DB_PASSWORD:-wafer_fa}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  thingsboard-postgres:
    image: postgres:16-alpine
    container_name: wafer-fa-tb-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=thingsboard
      - POSTGRES_PASSWORD=${THINGSBOARD_DB_PASSWORD:-thingsboard}
    volumes:
      - tb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  thingsboard:
    image: thingsboard/tb-node:4.3.1.3
    container_name: wafer-fa-thingsboard
    restart: unless-stopped
    depends_on:
      thingsboard-postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
      - "7070:7070"
      - "1883:1883"
      - "8883:8883"
      - "5683-5688:5683-5688/udp"
    environment:
      - TB_SERVICE_ID=wafer-fa-tb
      - SPRING_DATASOURCE_URL=jdbc:postgresql://thingsboard-postgres:5432/thingsboard
      - SPRING_DATASOURCE_PASSWORD=${THINGSBOARD_DB_PASSWORD:-thingsboard}
    volumes:
      - tb_data:/data
      - tb_logs:/var/log/thingsboard

volumes:
  timescale_data:
  tb_postgres_data:
  tb_data:
  tb_logs:
