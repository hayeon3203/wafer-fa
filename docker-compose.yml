services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: daol-fascope-timescaledb
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=wafer_fa
      - POSTGRES_USER=wafer_fa
      - POSTGRES_PASSWORD=${WAFER_FA_DB_PASSWORD:-wafer_fa}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  thingsboard-postgres:
    image: postgres:16-alpine
    container_name: daol-fascope-tb-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=thingsboard
      - POSTGRES_PASSWORD=${THINGSBOARD_DB_PASSWORD:-thingsboard}
    volumes:
      - tb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  thingsboard:
    image: thingsboard/tb-node:4.3.1.3
    container_name: daol-fascope-thingsboard
    restart: unless-stopped
    depends_on:
      thingsboard-postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
      - "7070:7070"
      - "1883:1883"
      - "8883:8883"
      - "5683-5688:5683-5688/udp"
    environment:
      - TB_SERVICE_ID=daol-fascope-tb
      - SPRING_DATASOURCE_URL=jdbc:postgresql://thingsboard-postgres:5432/thingsboard
      - SPRING_DATASOURCE_PASSWORD=${THINGSBOARD_DB_PASSWORD:-thingsboard}
    volumes:
      - tb_data:/data
      - tb_logs:/var/log/thingsboard

  kafka:
    image: apache/kafka:latest
    container_name: daol-fascope-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

  # 새 장비 전용. 이 박스(원본 GB10)는 여러 프로젝트가 공유하는 네이티브 Qdrant가
  # 이미 6333에 떠 있어서(wafer_defect_cases 컬렉션도 거기 있음) 이 서비스를 올리면
  # 포트 충돌로 기동 실패함 — 의도된 동작, 이 박스에서는 `docker compose up qdrant`
  # 하지 말 것. 새 장비엔 그런 공유 인스턴스가 없으므로 정상 기동.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: daol-fascope-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  waferscope-nginx:
    image: nginx:alpine
    container_name: daol-fascope-waferscope-nginx
    restart: unless-stopped
    depends_on:
      - thingsboard
    ports:
      - "8090:80"
    volumes:
      - ./nginx/waferscope.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/waferscope.ico:/etc/nginx/custom/waferscope.ico:ro
      - ./nginx/logo_title_white.svg:/etc/nginx/custom/logo_title_white.svg:ro
      - ./nginx/fascope-lang.js:/etc/nginx/custom/fascope-lang.js:ro
      - ./nginx/fascope.css:/etc/nginx/custom/fascope.css:ro

volumes:
  # name: 은 wafer-fa -> daol-fascope repo rename(2026-07-23) 이전 볼륨명을 그대로
  # 가리켜서 이 박스의 기존 데이터에 재연결됨. external:true는 없음 — 이 이름의
  # 볼륨이 없는 새 장비에서는 `docker compose up`이 자동으로 새로 만든다.
  timescale_data:
    name: wafer-fa_timescale_data
  tb_postgres_data:
    name: wafer-fa_tb_postgres_data
  tb_data:
    name: wafer-fa_tb_data
  tb_logs:
    name: wafer-fa_tb_logs
  qdrant_data:
    name: daol-fascope_qdrant_data
