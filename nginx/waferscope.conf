server {
    listen 80;
    server_name _;

    location = /thingsboard.ico {
        alias /etc/nginx/custom/waferscope.ico;
    }

    location = /assets/logo_title_white.svg {
        alias /etc/nginx/custom/logo_title_white.svg;
    }

    location / {
        proxy_pass http://thingsboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (실시간 텔레메트리 위젯 갱신용)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # sub_filter가 압축 안 걸린 응답에서만 동작함
        proxy_set_header Accept-Encoding "";

        sub_filter '<title>ThingsBoard</title>' '<title>WaferScope</title>';

        # 안 쓰는 메뉴는 숨기고, uptimeUI의 네이비 팔레트를 레이아웃 영역별로 적용.
        # 각 색은 독립 변수로 두어 이후 영역별 색상 변경이 서로 영향을 주지 않게 한다.
        sub_filter '</head>' '<style>:root{--fascope-sidenav-bg:#19252e;--fascope-nav-header-bg:#19252e;--fascope-side-menu-bg:#19252e;--fascope-primary-toolbar-bg:#19252e;--fascope-dashboard-title-bg:#19252e;--fascope-menu-active-bg:#27363f;--fascope-menu-accent:#0173cf}a[href="/iot-hub"],a[href^="/entities"],a[href="/calculatedFields"],a[href^="/edgeManagement"],a[href="/resources/images"],a[href="/resources/scada-symbols"],a[href="/resources/javascript-library"]{display:none!important}mat-sidenav.tb-site-sidenav{background:var(--fascope-sidenav-bg)!important;color:#fff!important}mat-sidenav.tb-site-sidenav .tb-nav-header-toolbar{background:var(--fascope-nav-header-bg)!important;color:#fff!important}mat-sidenav.tb-site-sidenav .tb-side-menu-toolbar{background:var(--fascope-side-menu-bg)!important;color:#fff!important}mat-sidenav.tb-site-sidenav a,mat-sidenav.tb-site-sidenav button{color:#aeb7bd!important}mat-sidenav.tb-site-sidenav a:hover,mat-sidenav.tb-site-sidenav button:hover,mat-sidenav.tb-site-sidenav a.tb-active{background:var(--fascope-menu-active-bg)!important;color:#fff!important}mat-sidenav.tb-site-sidenav a.tb-active{border-left:4px solid var(--fascope-menu-accent)!important}mat-sidenav-content .tb-primary-toolbar{background:var(--fascope-primary-toolbar-bg)!important;color:#fff!important}mat-sidenav-content .tb-primary-toolbar *{color:#fff!important}.fascope-dashboard-title-bar{background:var(--fascope-dashboard-title-bg)!important;color:#fff!important}.fascope-dashboard-title-bar *{color:#fff!important}</style></head>';

        # 개체/Edge management는 href 없는 토글이라 DOM에서 제거. Overview/Detail
        # 제목은 라우팅 때 다시 그려지므로 MutationObserver로 실제 toolbar만 표시한다.
        sub_filter '</body>' '<script>(function(){var L=["개체","Edge management"],D=["Wafer Overview","Wafer Detail"];function hideMenus(){document.querySelectorAll("a.tb-button-toggle").forEach(function(a){var t=a.textContent||"";if(L.some(function(l){return t.indexOf(l)!==-1;})){(a.closest("li")||a).remove();}});}function markDashboardTitles(){document.querySelectorAll("mat-toolbar,[class*=dashboard-title]").forEach(function(el){var t=(el.textContent||"").trim();if(D.some(function(d){return t.indexOf(d)!==-1;})){var bar=el.closest("mat-toolbar")||el;bar.classList.add("fascope-dashboard-title-bar");}});}function sweep(){hideMenus();markDashboardTitles();}new MutationObserver(sweep).observe(document.documentElement,{childList:true,subtree:true});sweep();})();</script></body>';

        sub_filter_once off;
        sub_filter_types text/html;
    }
}
