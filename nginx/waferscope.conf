server {
    listen 80;
    server_name _;

    location = /thingsboard.ico {
        alias /etc/nginx/custom/waferscope.ico;
    }

    location = /assets/logo_title_white.svg {
        alias /etc/nginx/custom/logo_title_white.svg;
    }

    location / {
        proxy_pass http://thingsboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (실시간 텔레메트리 위젯 갱신용)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # sub_filter가 압축 안 걸린 응답에서만 동작함
        proxy_set_header Accept-Encoding "";

        sub_filter '<title>ThingsBoard</title>' '<title>WaferScope</title>';

        # 안 쓰는 메뉴는 숨기고, uptimeUI의 네이비 팔레트를 레이아웃 영역별로 적용.
        # 각 색은 독립 변수로 두어 이후 영역별 색상 변경이 서로 영향을 주지 않게 한다.
        sub_filter '</head>' '<style>:root{--fascope-sidenav-bg:#19252e;--fascope-nav-header-bg:#19252e;--fascope-side-menu-bg:#19252e;--fascope-primary-toolbar-bg:#19252e;--fascope-dashboard-title-bg:#19252e;--fascope-menu-active-bg:#27363f;--fascope-menu-accent:#0173cf;--fascope-menu-radius:8px}a[href="/iot-hub"],a[href^="/entities"],a[href="/calculatedFields"],a[href^="/edgeManagement"],a[href="/resources/images"],a[href="/resources/scada-symbols"],a[href="/resources/javascript-library"]{display:none!important}mat-sidenav.tb-site-sidenav{background:var(--fascope-sidenav-bg)!important;color:#fff!important}mat-sidenav.tb-site-sidenav .tb-nav-header-toolbar{position:relative;background:var(--fascope-nav-header-bg)!important;color:#fff!important}mat-sidenav.tb-site-sidenav .tb-side-menu-toolbar{background:var(--fascope-side-menu-bg)!important;color:#fff!important}mat-sidenav.tb-site-sidenav .tb-side-menu>li{border-bottom-color:rgba(255,255,255,.06)!important}mat-sidenav.tb-site-sidenav .tb-side-menu a{width:calc(100% - 16px)!important;margin:4px 8px!important;border-radius:var(--fascope-menu-radius)!important;box-sizing:border-box}mat-sidenav.tb-site-sidenav a,mat-sidenav.tb-site-sidenav button{color:#aeb7bd!important}mat-sidenav.tb-site-sidenav a:hover,mat-sidenav.tb-site-sidenav button:hover,mat-sidenav.tb-site-sidenav a.tb-active{background:var(--fascope-menu-active-bg)!important;color:#fff!important}mat-sidenav.tb-site-sidenav a.tb-active{border-left:3px solid var(--fascope-menu-accent)!important}mat-sidenav-content .tb-primary-toolbar{background:var(--fascope-primary-toolbar-bg)!important;color:#fff!important}mat-sidenav-content .tb-primary-toolbar *{color:#fff!important}div.tb-dashboard-page mat-toolbar.mat-primary,div.tb-dashboard-page .tb-dashboard-toolbar,.fascope-dashboard-title-bar{--mat-toolbar-container-background-color:var(--fascope-dashboard-title-bg)!important;background:var(--fascope-dashboard-title-bg)!important;color:#fff!important}div.tb-dashboard-page mat-toolbar.mat-primary *,div.tb-dashboard-page .tb-dashboard-toolbar *,.fascope-dashboard-title-bar *{color:#fff!important}#fascope-menu-toggle{position:absolute;right:8px;top:14px;z-index:3;width:36px;height:36px;padding:0;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#fff!important;cursor:pointer;font-size:22px;line-height:36px;text-align:center}#fascope-menu-toggle:hover{background:rgba(255,255,255,.16)!important}#fascope-lang-toggle{position:absolute;right:52px;top:14px;z-index:3;height:36px;padding:0 10px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#fff!important;cursor:pointer;font-size:13px;font-family:Roboto,Arial,sans-serif;line-height:36px}#fascope-lang-toggle:hover{background:rgba(255,255,255,.16)!important}html.fascope-menu-collapsed #fascope-lang-toggle{display:none!important}@media(max-width:959px){#fascope-lang-toggle{display:none!important}}@media(min-width:960px){mat-sidenav.tb-site-sidenav,mat-sidenav-content{transition:width .2s ease,margin-left .2s ease!important}html.fascope-menu-collapsed mat-sidenav.tb-site-sidenav{width:72px!important}html.fascope-menu-collapsed mat-sidenav-content{margin-left:72px!important}html.fascope-menu-collapsed mat-sidenav.tb-site-sidenav .tb-logo-title{display:none!important}html.fascope-menu-collapsed #fascope-menu-toggle{right:18px}html.fascope-menu-collapsed mat-sidenav.tb-site-sidenav .tb-side-menu a{justify-content:center!important;padding-left:0!important;padding-right:0!important;font-size:0!important}html.fascope-menu-collapsed mat-sidenav.tb-site-sidenav .tb-side-menu a>span,html.fascope-menu-collapsed mat-sidenav.tb-site-sidenav .tb-menu-toggle-list{display:none!important}html.fascope-menu-collapsed mat-sidenav.tb-site-sidenav .tb-side-menu tb-icon{margin:0!important;font-size:22px!important}}@media(max-width:959px){#fascope-menu-toggle{display:none!important}}</style></head>';

        # 개체/Edge management는 href 없는 토글이라 DOM에서 제거. Overview/Detail
        # 제목은 라우팅 때 다시 그려지므로 MutationObserver로 실제 toolbar만 표시한다.
        sub_filter '</body>' '<script>(function(){var L=["개체","Edge management"],D=["Wafer Overview","Wafer Detail"],KEY="fascopeMenuCollapsed",LANG_KEY="fascopeLang",koMap=new WeakMap();function getLang(){return localStorage.getItem(LANG_KEY)==="en"?"en":"ko";}function applyTranslations(){}function setCollapsed(v){document.documentElement.classList.toggle("fascope-menu-collapsed",v);var b=document.getElementById("fascope-menu-toggle");if(b){b.textContent=v?"chevron_right":"chevron_left";b.setAttribute("aria-expanded",v?"false":"true");var fascopeEn=getLang()==="en";b.title=fascopeEn?(v?"Expand menu":"Collapse menu"):(v?"메뉴 펼치기":"메뉴 접기");b.setAttribute("aria-label",fascopeEn?"Collapse or expand the left menu":"좌측 메뉴 접기 또는 펼치기");}setTimeout(function(){window.dispatchEvent(new Event("resize"));},220);}function ensureToggle(){if(document.getElementById("fascope-menu-toggle"))return;var bar=document.querySelector("mat-sidenav.tb-site-sidenav .tb-nav-header-toolbar");if(!bar)return;var b=document.createElement("button");b.id="fascope-menu-toggle";b.type="button";b.className="material-icons";b.addEventListener("click",function(){var v=!document.documentElement.classList.contains("fascope-menu-collapsed");localStorage.setItem(KEY,v?"1":"0");setCollapsed(v);});bar.appendChild(b);setCollapsed(localStorage.getItem(KEY)==="1");}function updateLangToggleLabel(){var b=document.getElementById("fascope-lang-toggle");if(b){b.textContent=getLang()==="en"?"한":"EN";}}function ensureLangToggle(){if(document.getElementById("fascope-lang-toggle")){updateLangToggleLabel();return;}var bar=document.querySelector("mat-sidenav.tb-site-sidenav .tb-nav-header-toolbar");if(!bar)return;var b=document.createElement("button");b.id="fascope-lang-toggle";b.type="button";b.title="Switch language";b.addEventListener("click",function(e){e.stopPropagation();setLang(getLang()==="en"?"ko":"en");});bar.appendChild(b);updateLangToggleLabel();}function setLang(v){localStorage.setItem(LANG_KEY,v);var collapsed=document.documentElement.classList.contains("fascope-menu-collapsed");setCollapsed(collapsed);updateLangToggleLabel();applyTranslations();}function hideMenus(){document.querySelectorAll("a.tb-button-toggle").forEach(function(a){var t=a.textContent||"";if(L.some(function(l){return t.indexOf(l)!==-1;})){(a.closest("li")||a).remove();}});}function markDashboardTitles(){document.querySelectorAll("mat-toolbar,[class*=dashboard-title]").forEach(function(el){var t=(el.textContent||"").trim();if(D.some(function(d){return t.indexOf(d)!==-1;})){var bar=el.closest("mat-toolbar")||el;bar.classList.add("fascope-dashboard-title-bar");}});}function sweep(){hideMenus();markDashboardTitles();ensureToggle();ensureLangToggle();applyTranslations();}new MutationObserver(sweep).observe(document.documentElement,{childList:true,subtree:true});setCollapsed(localStorage.getItem(KEY)==="1");sweep();})();</script></body>';

        sub_filter_once off;
        sub_filter_types text/html;
    }
}
