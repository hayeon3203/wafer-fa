server {
    listen 80;
    server_name _;

    location = /thingsboard.ico {
        alias /etc/nginx/custom/waferscope.ico;
    }

    location = /assets/logo_title_white.svg {
        alias /etc/nginx/custom/logo_title_white.svg;
    }

    location / {
        proxy_pass http://thingsboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (실시간 텔레메트리 위젯 갱신용)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # sub_filter가 압축 안 걸린 응답에서만 동작함
        proxy_set_header Accept-Encoding "";

        sub_filter '<title>ThingsBoard</title>' '<title>WaferScope</title>';

        # 안 쓰는 좌측 메뉴 항목 숨김 (색상/다크테마 없이 숨김만).
        sub_filter '</head>' '<style>a[href="/iot-hub"],a[href^="/entities"],a[href="/calculatedFields"],a[href^="/edgeManagement"],a[href="/resources/images"],a[href="/resources/scada-symbols"],a[href="/resources/javascript-library"]{display:none!important}</style></head>';

        # 개체/Edge management는 href 없는 순수 토글이라 CSS로 못 잡아서 JS로 DOM 제거.
        sub_filter '</body>' '<script>(function(){var L=["개체","Edge management"];function sweep(){document.querySelectorAll("a.tb-button-toggle").forEach(function(a){var t=a.textContent||"";if(L.some(function(l){return t.indexOf(l)!==-1;})){(a.closest("li")||a).remove();}});}new MutationObserver(sweep).observe(document.documentElement,{childList:true,subtree:true});sweep();})();</script></body>';

        sub_filter_once off;
        sub_filter_types text/html;
    }
}
