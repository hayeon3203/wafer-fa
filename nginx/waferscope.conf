server {
    listen 80;
    server_name _;

    location = /thingsboard.ico {
        alias /etc/nginx/custom/waferscope.ico;
    }

    location = /assets/logo_title_white.svg {
        alias /etc/nginx/custom/logo_title_white.svg;
    }

    location / {
        proxy_pass http://thingsboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (실시간 텔레메트리 위젯 갱신용)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # sub_filter가 압축 안 걸린 응답에서만 동작함
        proxy_set_header Accept-Encoding "";

        sub_filter '<title>ThingsBoard</title>' '<title>Daol-FAScope</title>';

        # CE엔 whiteLabel/Custom Menu API가 없음(PE 전용) — 라우트 경로 기준으로
        # 안 쓰는 좌측 메뉴 항목만 CSS로 숨김. API 사용량(/usage)은 의도적으로 유지.
        # 경로는 ui-ngx jar 내 컴파일된 청크(chunk-PI32PL4C.js)에서 역추적함.
        # 참고 이미지(uptime.com 스타일: 짙은 네이비 사이드바 + 밝은 회색 본문 +
        # 파란 포인트 버튼) 톤으로 배색만 오버라이드. mat-sidenav/mat-sidenav-content/
        # tb-active는 실제 캡처한 xpath·class 기준, 위젯 카드 내부까진 브라우저 없이
        # 확인 못 해서 손 안 댐 — 스샷 보고 추가 조정 필요.
        sub_filter '</head>' '<style>a[href="/iot-hub"],a[href^="/entities"],a[href="/calculatedFields"],a[href^="/edgeManagement"],a[href="/resources/images"],a[href="/resources/scada-symbols"],a[href="/resources/javascript-library"]{display:none!important}mat-sidenav,mat-sidenav mat-toolbar,.mat-toolbar{background:#12141c!important;color:#e5e7eb!important}mat-sidenav-content{background:#f4f6f9!important}a.tb-active{border-left:3px solid #3b82f6!important;background:rgba(59,130,246,.15)!important}.mat-mdc-raised-button.mat-primary,.mat-mdc-unelevated-button.mat-primary,.mat-mdc-flat-button.mat-primary{background-color:#2f6fed!important;color:#fff!important;border-radius:6px!important}</style></head>';

        # 개체(entities)/Edge management는 순수 토글(routerLink 없어서 href로 못
        # 잡음) — 실제 캡처한 DOM에서 확인한 클래스 a.tb-button-toggle 로 직접 잡음
        # (커스텀 태그명 추측 대신 실물 클래스 사용). 라벨 텍스트로 이 둘만 찍어서
        # li 자체를 DOM에서 제거(진짜 삭제, 아래 항목 자동으로 위로 채워짐).
        sub_filter '</body>' '<script>(function(){var L=["개체","Edge management"];function sweep(){document.querySelectorAll("a.tb-button-toggle").forEach(function(a){var t=a.textContent||"";if(L.some(function(l){return t.indexOf(l)!==-1;})){(a.closest("li")||a).remove();}});}new MutationObserver(sweep).observe(document.documentElement,{childList:true,subtree:true});sweep();})();</script></body>';

        sub_filter_once off;
        sub_filter_types text/html;
    }
}
