server {
    listen 80;
    server_name _;

    location = /thingsboard.ico {
        alias /etc/nginx/custom/waferscope.ico;
    }

    location = /assets/logo_title_white.svg {
        alias /etc/nginx/custom/logo_title_white.svg;
    }

    location / {
        proxy_pass http://thingsboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (실시간 텔레메트리 위젯 갱신용)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # sub_filter가 압축 안 걸린 응답에서만 동작함
        proxy_set_header Accept-Encoding "";

        sub_filter '<title>ThingsBoard</title>' '<title>Daol-FAScope</title>';

        # CE엔 whiteLabel/Custom Menu API가 없음(PE 전용) — 라우트 경로 기준으로
        # 안 쓰는 좌측 메뉴 항목만 CSS로 숨김. API 사용량(/usage)은 의도적으로 유지.
        # 경로는 ui-ngx jar 내 컴파일된 청크(chunk-PI32PL4C.js)에서 역추적함.
        # 참고 이미지(uptime.com 스타일: 짙은 네이비 사이드바 + 밝은 회색 본문 +
        # 파란 포인트 버튼) 톤으로 배색을 오버라이드. mat-sidenav/
        # mat-sidenav-content/tb-active는 실제 캡처한 xpath·class 기준이며,
        # 커스텀 위젯 팔레트는 setup_thingsboard_dashboard.py와 함께 맞춘다.
        sub_filter '</head>' '<style>:root{--fascope-navy:#172833;--fascope-navy-hover:#243b49;--fascope-blue:#0b84e5;--fascope-blue-soft:#eaf5fd;--fascope-green:#2ecc71;--fascope-orange:#f5a623;--fascope-red:#e3262e;--fascope-bg:#f4f6f8;--fascope-border:#dce3e8;--fascope-text:#263238;--fascope-muted:#7b8790}a[href="/iot-hub"],a[href^="/entities"],a[href="/calculatedFields"],a[href^="/edgeManagement"],a[href="/resources/images"],a[href="/resources/scada-symbols"],a[href="/resources/javascript-library"]{display:none!important}mat-sidenav,mat-sidenav mat-toolbar{background:var(--fascope-navy)!important;color:#fff!important}mat-sidenav a,mat-sidenav button{color:#aebbc3!important}mat-sidenav a:hover,mat-sidenav button:hover{background:var(--fascope-navy-hover)!important;color:#fff!important}mat-sidenav a.tb-active{border-left:4px solid var(--fascope-blue)!important;background:var(--fascope-navy-hover)!important;color:#fff!important}mat-sidenav-content{background:var(--fascope-bg)!important}.mat-toolbar:not(mat-sidenav .mat-toolbar){background:#fff!important;color:var(--fascope-text)!important;border-bottom:1px solid var(--fascope-border)!important}.mat-mdc-card,.tb-card{border:1px solid var(--fascope-border)!important;box-shadow:0 2px 8px rgba(23,40,51,.06)!important}.mat-mdc-raised-button.mat-primary,.mat-mdc-unelevated-button.mat-primary,.mat-mdc-flat-button.mat-primary{background-color:var(--fascope-blue)!important;color:#fff!important;border-radius:5px!important}.mat-mdc-tab .mdc-tab-indicator__content--underline{border-color:var(--fascope-blue)!important}.mat-mdc-tab.mdc-tab--active .mdc-tab__text-label,.mat-mdc-tab.mdc-tab--active .mat-icon{color:var(--fascope-blue)!important}.fascope-title-bar{background:var(--fascope-title-bg)!important;color:#fff!important}.fascope-title-bar,.fascope-title-bar *{color:#fff!important}.fascope-widget-title{display:block!important;background:var(--fascope-title-bg)!important;color:#fff!important;border-radius:4px 4px 0 0;padding:8px 12px!important;box-sizing:border-box}</style></head>';

        # 개체(entities)/Edge management는 순수 토글(routerLink 없어서 href로 못
        # 잡음) — 실제 캡처한 DOM에서 확인한 클래스 a.tb-button-toggle 로 직접 잡음
        # (커스텀 태그명 추측 대신 실물 클래스 사용). 라벨 텍스트로 이 둘만 찍어서
        # li 자체를 DOM에서 제거(진짜 삭제, 아래 항목 자동으로 위로 채워짐).
        sub_filter '</body>' '<script>(function(){var L=["개체","Edge management"],D={"Wafer Overview":"#0b84e5","Wafer Detail":"#f5a623"},W={"결함 검출 개요":"#0b84e5","Wafer Yield Map":"#2ecc71","Process Risk & Alerts":"#e3262e","설비/공정 텔레메트리":"#0b84e5","센서 데이터":"#0b84e5","공정 위험 지표":"#e3262e","공정 단계 타임라인":"#f5a623","파이프라인 실행":"#f5a623","결함-센서 상관관계":"#0b84e5","Lot 선택":"#0b84e5","Composite 웨이퍼맵":"#2ecc71","전체 웨이퍼 데이터":"#0b84e5","모델 임계값 슬라이더":"#f5a623","원인분석":"#e3262e"};function paint(map,isDashboard){document.querySelectorAll(".tb-widget-title,mat-toolbar,[class*=dashboard-title],[class*=widget-title]").forEach(function(el){var t=(el.textContent||"").trim(),k=Object.keys(map).find(function(x){return t.indexOf(x)!==-1;});if(!k)return;el.style.setProperty("--fascope-title-bg",map[k]);el.classList.add(isDashboard?"fascope-title-bar":"fascope-widget-title");if(isDashboard){var bar=el.closest("mat-toolbar")||el.parentElement;if(bar){bar.style.setProperty("--fascope-title-bg",map[k]);bar.classList.add("fascope-title-bar");}}});}function sweep(){document.querySelectorAll("a.tb-button-toggle").forEach(function(a){var t=a.textContent||"";if(L.some(function(l){return t.indexOf(l)!==-1;})){(a.closest("li")||a).remove();}});paint(D,true);paint(W,false);}new MutationObserver(sweep).observe(document.documentElement,{childList:true,subtree:true});sweep();})();</script></body>';

        sub_filter_once off;
        sub_filter_types text/html;
    }
}
